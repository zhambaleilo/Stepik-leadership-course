name: Generate Article Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'articles/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Generate article pages
        run: node tools/generate-article-pages.js
      
      - name: Build sitemap
        run: node tools/build-sitemap.js
      
      - name: Commit generated pages and sitemap
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add articles/pages/ sitemap.xml
          git diff --staged --quiet || git commit -m "Auto-generate article pages and sitemap [skip ci]"
          git pull --rebase origin main
          git push
