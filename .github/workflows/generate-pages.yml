name: Generate Article Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'articles/**'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Generate article pages
        run: node tools/generate-article-pages.js
      
      - name: Commit generated pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add articles/pages/
          git diff --staged --quiet || git commit -m "Auto-generate article pages [skip ci]"
          git push
