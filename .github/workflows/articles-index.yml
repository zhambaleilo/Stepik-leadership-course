name: rebuild articles index
on:
  push:
    paths:
      - 'articles/*.md'
      - 'tools/build-index.js'
      - '.github/workflows/articles-index.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: generate index.json
        run: node tools/build-index.js
      - name: commit index
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add articles/index.json
          git diff --staged --quiet || git commit -m "chore: rebuild articles index"
          git push
