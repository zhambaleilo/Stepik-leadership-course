<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Полная версия · Симулятор управленческих диалогов — My Pro Skills</title>
  <meta name="description" content="Полная версия симулятора с ИИ-оценкой по 11 критериям. Доступ по паролю.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="index.html" class="back-link">← Демо-режим</a>
      <h1>🔒 Полная версия</h1>
      <p class="subtitle">Доступ к симулятору с ИИ-оценкой по 11 критериям предоставляется по паролю.</p>
    </div>
    
    <div class="workspace" style="min-height:auto">
      <div class="gate-card">
        <h2>Введите пароль</h2>
        <p class="gate-note">Пароли выдаются участникам тестовой группы. Если у вас нет пароля — пройдите <a href="index.html">демо-режим</a>.</p>
        <form id="gateForm" class="gate-form">
          <input type="text" id="gateCode" placeholder="Например: ALPHA-7821" autocomplete="off">
          <button type="submit" class="cta-btn">Войти</button>
        </form>
        <div id="gateError" class="gate-error" style="display:none">Неверный пароль или лимит сессий исчерпан.</div>
        <div id="gateSuccess" class="gate-success" style="display:none">✅ Пароль принят. Загрузка сценария...</div>
      </div>
    </div>
  </div>
  
  <script>
    // Заглушка: проверка пароля будет на Шаге 5 через Supabase
    document.getElementById('gateForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const code = document.getElementById('gateCode').value.trim();
      if (!code) return;
      
      // Временная проверка: любой непустой пароль показывает успех
      // На Шаге 5 здесь будет запрос к /api/verify-code
      document.getElementById('gateError').style.display = 'none';
      document.getElementById('gateSuccess').style.display = 'block';
      
      // TODO: после подключения API — редирект на полноценную игру
      // window.location.href = 'play.html?code=' + encodeURIComponent(code);
    });
  </script>
</body>
</html>
