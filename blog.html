<script src="/js/marked.min.js"></script>
<script>
const app = document.getElementById('app');
const q = new URLSearchParams(location.search);
const slug = q.get('slug');
const NS = 'my-pro-skills.ru'; // пространство имён счётчика (Abacus)
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseFM(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
  const out = {};
  if (!m) return out;
  let key = null;
  m[1].split(/\r?\n/).forEach(function (l) {
    if (/^\s+\S/.test(l) && key) {
      out[key] = (out[key] ? out[key] + ' ' : '') + l.trim();
      return;
    }
    const i = l.indexOf(':');
    if (i > 0) {
      key = l.slice(0, i).trim();
      const v = l.slice(i + 1).trim();
      out[key] = (v === '>-' || v === '>' || v === '|-' || v === '|') ? '' : v;
    } else {
      key = null;
    }
  });
  Object.keys(out).forEach(function (k) {
    out[k] = out[k].replace(/^["']|["']$/g, '').trim();
  });
  return out;
}

// ===== 1. СЧЁТЧИК (просмотры и реакции) через Abacus =====
function hashKey(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return ('00000000' + h.toString(16)).slice(-8);
}
function safeKey(k) { return 'k-' + hashKey(k); }
async function counterGet(key) {
  try {
    const r = await fetch('https://abacus.jasoncameron.dev/get/' + NS + '/' + safeKey(key));
    if (!r.ok) return 0;
    const d = await r.json();
    return d.value || 0;
  } catch(e) { return 0; }
}
async function counterUp(key) {
  try {
    const r = await fetch('https://abacus.jasoncameron.dev/hit/' + NS + '/' + safeKey(key));
    if (!r.ok) return 0;
    const d = await r.json();
    return d.value || 0;
  } catch(e) { return 0; }
}

// ===== 2. ИКОНКИ И КНОПКИ =====
function eyeIcon(count) {
  return `<span style="display:inline-flex;align-items:center;gap:4px;color:var(--gray);font-size:13px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>${count}</span>`;
}

function reactionBtn(emoji, key, count) {
  return `<button class="rate-btn" data-key="${key}" 
    style="font-size:24px;background:none;border:2px solid var(--light-stripe);border-radius:12px;padding:10px 16px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:70px">
    <span style="font-size:28px">${emoji}</span>
    <span class="rcount" style="font-size:13px;color:var(--gray);font-weight:600">${count}</span>
  </button>`;
}

// ===== 3. ШАБЛОНЫ =====
function hero(title, sub, small) {
  return '<section class="sec-dark hero hero--blog"><div class="wrap"><div><h1'+(small?' style="font-size:34px;line-height:1.25"':'')+'>'+esc(title)+'</h1><span class="grad-line"></span>'+(sub?'<p style="margin:16px 0 0;color:var(--gray);font-size:19px;max-width:640px">'+esc(sub)+'</p>':'')+'</div></div><div class="wm"><i></i><i></i><i></i></div></section>';
}

function badges(list) {
  return (list||[]).map(t => '<span class="badge" style="margin-right:6px">'+esc(t)+'</span>').join('');
}

// ===== 4. ПРОСМОТР СТАТЬИ =====
async function view() {
  const r = await fetch('/articles/' + encodeURIComponent(slug) + '.md');
  if (!r.ok) {
    app.innerHTML = hero('Статьи','Методология, разборы и заметки My Pro Skills.') +
      '<section class="sec-light"><div class="wrap"><a class="back" href="/blog.html">← ко всем статьям</a><p style="color:var(--gray);text-align:center;padding:40px 0">Статья не найдена.</p></div></section>';
    return;
  }
  let t = await r.text();
  const fmd = parseFM(t);
  const title = fmd.title || 'Статья';
  const lead = fmd.lead || fmd.description || '';
  t = t.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/,'');

  // Увеличиваем счетчик просмотров
  const views = await counterUp(slug + '-views');

  // Получаем текущие реакции
  const [like, love, fire, think] = await Promise.all([
    counterGet(slug + '-like'),
    counterGet(slug + '-love'),
    counterGet(slug + '-fire'),
    counterGet(slug + '-think')
  ]);

  const reactionsBlock = `
    <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--line);text-align:center">
      <p style="color:var(--ink2);font-size:15px;margin-bottom:16px">Как вам статья?</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap" id="reactions">
        ${reactionBtn('👍', slug+'-like', like)}
        ${reactionBtn('❤️', slug+'-love', love)}
        ${reactionBtn('🔥', slug+'-fire', fire)}
        ${reactionBtn('🤔', slug+'-think', think)}
      </div>
      <p id="rate-msg" style="margin-top:14px;color:var(--mint);font-size:14px;opacity:0;transition:.3s">Спасибо за оценку!</p>
    </div>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end">
      ${eyeIcon(views)}
    </div>
  `;

  app.innerHTML = hero(title,lead,true) +
    '<section class="sec-light"><div class="wrap"><a class="back" href="/blog.html">← ко всем статьям</a><article class="article">' +
    marked.parse(t) + reactionsBlock +
    '</article></div></section>';

  // Обработчик кликов по реакциям
  document.querySelectorAll('.rate-btn').forEach(btn => {
    btn.addEventListener('click', async function() {
      const key = this.dataset.key;
      const voted = localStorage.getItem('voted_' + slug);
      if (voted) {
        const msg = document.getElementById('rate-msg');
        msg.textContent = 'Вы уже голосовали!';
        msg.style.opacity = '1';
        setTimeout(() => msg.style.opacity = '0', 2000);
        return;
      }
      const newCount = await counterUp(key);
      this.querySelector('.rcount').textContent = newCount;
      localStorage.setItem('voted_' + slug, key);
      
      document.querySelectorAll('.rate-btn').forEach(b => b.style.borderColor = 'var(--light-stripe)');
      this.style.borderColor = 'var(--mint)';
      
      const msg = document.getElementById('rate-msg');
      msg.textContent = 'Спасибо за оценку!';
      msg.style.opacity = '1';
      setTimeout(() => msg.style.opacity = '0', 2000);
    });
  });
}

// ===== 5. СПИСОК СТАТЕЙ =====
async function list() {
  let items = [];
  try { const r = await fetch('/articles/index.json'); if (r.ok) items = await r.json(); } catch(e) {}
  const head = hero('Статьи','Методология, разборы и заметки My Pro Skills.');
  if (!items.length) {
    app.innerHTML = head + '<section class="sec-light"><div class="wrap"><p style="color:var(--gray);text-align:center;padding:40px 0">Пока пусто. Напиши первую статью в /admin — и она появится здесь через минуту.</p></div></section>';
    return;
  }

  // Получаем просмотры для всех статей параллельно
  const viewsMap = {};
  await Promise.all(items.map(async it => {
    viewsMap[it.slug] = await counterGet(it.slug + '-views');
  }));

  const cards = items.map(it => 
    '<a class="card card--light" href="/articles/pages/'+encodeURIComponent(it.slug)+'.html">'+
    (it.cover?'<img src="'+esc(it.cover)+'" alt="" style="width:100%;height:160px;object-fit:cover;border-radius:12px;margin-bottom:14px">':'')+
    '<h3>'+esc(it.title)+'</h3><p style="margin-top:8px;color:var(--ink2)">'+esc(it.description)+'</p>'+
    '<div style="margin-top:12px;color:var(--gray);font-size:13px">'+(it.date?new Date(it.date).toLocaleDateString('ru-RU'):'')+' '+badges(it.tags)+'</div>'+
    '<div style="margin-top:10px">'+eyeIcon(viewsMap[it.slug] || 0)+'</div>'+
    '</a>'
  ).join('');

  app.innerHTML = head + '<section class="sec-light"><div class="wrap"><div class="grid" style="margin-top:48px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));max-width:920px;margin-left:auto;margin-right:auto">'+cards+'</div></div></section>';
}

slug ? view() : list();
</script>
