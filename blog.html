<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Статьи — My Pro Skills</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#1a2230;--ink2:#3a4658;--gray:#8a93a3;--line:#e6e9ef;--mint:#34d399;--bg:#f5f7fa;--card:#fff;--light-gray:#cdd5e0}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:30px;margin:0 0 6px}
.sub{color:var(--gray);margin:0 0 28px}
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;text-decoration:none;color:inherit;display:block;transition:.15s}
.card:hover{border-color:var(--mint);transform:translateY(-1px)}
.card h2{font-size:19px;margin:0 0 6px}
.card p{margin:0;color:var(--ink2);font-size:14px}
.meta{font-size:12px;color:var(--gray);margin-top:10px}
.tag{display:inline-block;background:#eef7f2;color:#1f9d6b;border-radius:20px;padding:2px 10px;font-size:12px;margin-right:6px}
.back{display:inline-block;margin-bottom:18px;color:#1f9d6b;text-decoration:none;font-weight:600}
.article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 30px}
.article h1{font-size:26px}
.article h2{font-size:20px;margin-top:28px;border-bottom:1px solid var(--line);padding-bottom:6px}
.article h3{font-size:17px;margin-top:22px}
.article p,.article li{color:var(--ink2)}
.article code{background:#eef1f6;padding:1px 6px;border-radius:6px;font-size:13px}
.article pre{background:#0f1622;color:#d6deeb;padding:14px 16px;border-radius:10px;overflow:auto}
.article pre code{background:none;color:inherit;padding:0}
.article img{max-width:100%;border-radius:10px}
.article a{color:#1f9d6b}
.empty{color:var(--gray);text-align:center;padding:40px}
nav.top{display:flex;gap:18px;align-items:center;padding:14px 20px;background:#0f1622}
nav.top a{color:var(--light-gray);text-decoration:none;font-size:14px}
nav.top a.on{color:var(--mint)}
</style>
</head>
<body>
<nav class="top">
<a href="/">Главная</a>
<a href="/courses.html">Курсы</a>
<a href="/projects.html">Проекты</a>
<a href="/blog.html" class="on">Статьи</a>
<a href="/index.html#approach">Подход</a>
<a href="/index.html#contacts">Контакты</a>
</nav>
<div class="wrap" id="app">Загрузка…</div>
<script src="/js/marked.min.js"></script>
<script>
const app=document.getElementById('app');
const q=new URLSearchParams(location.search);
const slug=q.get('slug');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tags(list){return (list||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('');}
async function view(){
  const r=await fetch('/articles/'+encodeURIComponent(slug)+'.md');
  if(!r.ok){app.innerHTML='<a class="back" href="/blog.html">← ко всем статьям</a><div class="empty">Статья не найдена.</div>';return;}
  let t=await r.text();
  t=t.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/,'');
  app.innerHTML='<a class="back" href="/blog.html">← ко всем статьям</a><article class="article">'+marked.parse(t)+'</article>';
}
async function list(){
  let items=[];
  try{const r=await fetch('/articles/index.json');if(r.ok)items=await r.json();}catch(e){}
  if(!items.length){app.innerHTML='<h1>Статьи</h1><p class="sub">Методология, разборы и заметки My Pro Skills.</p><div class="empty">Пока пусто. Напиши первую статью в /admin — и она появится здесь через минуту.</div>';return;}
  app.innerHTML='<h1>Статьи</h1><p class="sub">Методология, разборы и заметки My Pro Skills.</p><div class="grid">'+
    items.map(it=>'<a class="card" href="/blog.html?slug='+encodeURIComponent(it.slug)+'">'+
      (it.cover?'<img src="'+esc(it.cover)+'" alt="" style="width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:12px">':'')+
      '<h2>'+esc(it.title)+'</h2><p>'+esc(it.description)+'</p>'+
      '<div class="meta">'+(it.date?new Date(it.date).toLocaleDateString('ru-RU'):'')+' '+tags(it.tags)+'</div></a>').join('')+
    '</div>';
}
slug?view():list();
</script>
</body>
</html>
