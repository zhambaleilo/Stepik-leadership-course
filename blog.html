<style>
.back{display:inline-block;margin-bottom:18px;color:var(--mint);text-decoration:none;font-weight:600}
.article{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 34px}
.article h1{font-size:28px;margin:0 0 8px}
.article h2{font-size:21px;margin:30px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.article h3{font-size:17px;margin:22px 0 8px}
.article p,.article li{color:var(--ink2);font-size:16px}
.article ul,.article ol{padding-left:22px;color:var(--ink2)}
.article a{color:var(--mint);font-weight:600}
.article code{background:#eef1f6;padding:1px 6px;border-radius:6px;font-size:14px}
.article pre{background:#0f1622;color:#d6deeb;padding:14px 16px;border-radius:12px;overflow:auto}
.article pre code{background:none;color:inherit;padding:0}
.article img{max-width:100%;border-radius:12px}
.article blockquote{border-left:3px solid var(--mint);margin:16px 0;padding:4px 16px;color:var(--ink2);font-style:italic}
.card h3{font-size:19px;margin:0 0 6px}
</style>

<body>
<div class="progress"></div>
<header class="header">
  <nav class="nav">
    <a class="logo" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="12" width="5" height="9" rx="2.5" fill="#9AA5B1"/><rect x="9.5" y="7" width="5" height="14" rx="2.5" fill="#E1E7EE"/><rect x="17" y="2" width="5" height="19" rx="2.5" fill="#FFFFFF"/></svg>

    <button class="burger" aria-label="Меню"><span></span><span></span><span></span></button>
    <div class="menu">
      <a href="index.html#courses">Курсы</a>

    </div>

<main id="app">Загрузка…</main>
<footer class="footer">
  <div class="wrap">
    <div class="footer__row">
      <div>© <span data-year>2024</span> My Pro Skills. Все права защищены.<br>
        Email: <a href="mailto:zhambalkhumaev@yandex.ru">zhambalkhumaev@yandex.ru</a> ·
        Telegram: <a href="https://t.me/Zhambaleilo">@Zhambaleilo</a></div>
      <div><a href="index.html">Все курсы</a> · <a href="leadership.html">Лидерство наизнанку</a></div>
    </div>
  </div>
  <div class="wm"><i></i><i></i><i></i></div>
</footer>
<button class="top" aria-label="Наверх">↑</button>
<script src="script.js"></script>
<script src="/js/marked.min.js"></script>
<script>
const app=document.getElementById('app');
const q=new URLSearchParams(location.search);
const slug=q.get('slug');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hero(title,sub,small){return '<section class="sec-dark hero"><div class="wrap center"><div><h1'+(small?' style="font-size:34px;line-height:1.25"':'')+'>'+esc(title)+'</h1><span class="grad-line"></span>'+(sub?'<p style="margin:26px auto 0;color:var(--gray);font-size:19px;max-width:640px">'+esc(sub)+'</p>':'')+'</div></div><div class="wm"><i></i><i></i><i></i></div></section>';}
function badges(list){return (list||[]).map(t=>'<span class="badge" style="margin-right:6px">'+esc(t)+'</span>').join('');}
async function view(){
  const r=await fetch('/articles/'+encodeURIComponent(slug)+'.md');
  if(!r.ok){app.innerHTML=hero('Статьи','Методология, разборы и заметки My Pro Skills.')+'<section class="sec-light"><div class="wrap"><a class="back" href="/blog.html">← ко всем статьям</a><p style="color:var(--gray);text-align:center;padding:40px 0">Статья не найдена.</p></div></section>';return;}
  let t=await r.text();
  const fm=t.match(/^---\r?\n([\s\S]*?)\r?\n---/);
  let title='Статья';
  if(fm){const tl=fm[1].match(/title:\s*"?(.+?)"?\s*$/m);if(tl)title=tl[1];}
  t=t.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/,'');
  app.innerHTML=hero(title,'',true)+'<section class="sec-light"><div class="wrap"><a class="back" href="/blog.html">← ко всем статьям</a><article class="article">'+marked.parse(t)+'</article></div></section>';
}
async function list(){
  let items=[];
  try{const r=await fetch('/articles/index.json');if(r.ok)items=await r.json();}catch(e){}
  const head=hero('Статьи','Методология, разборы и заметки My Pro Skills.');
  if(!items.length){app.innerHTML=head+'<section class="sec-light"><div class="wrap"><p style="color:var(--gray);text-align:center;padding:40px 0">Пока пусто. Напиши первую статью в /admin — и она появится здесь через минуту.</p></div></section>';return;}
  const cards=items.map(it=>'<a class="card card--light" href="/blog.html?slug='+encodeURIComponent(it.slug)+'">'+
    (it.cover?'<img src="'+esc(it.cover)+'" alt="" style="width:100%;height:160px;object-fit:cover;border-radius:12px;margin-bottom:14px">':'')+
    '<h3>'+esc(it.title)+'</h3><p style="margin-top:8px;color:var(--ink2)">'+esc(it.description)+'</p>'+
    '<div style="margin-top:12px;color:var(--gray);font-size:13px">'+(it.date?new Date(it.date).toLocaleDateString('ru-RU'):'')+' '+badges(it.tags)+'</div></a>').join('');
  app.innerHTML=head+'<section class="sec-light"><div class="wrap"><div class="grid" style="margin-top:48px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));max-width:920px;margin-left:auto;margin-right:auto">'+cards+'</div></div></section>';
}
slug?view():list();
</script>
</body>
</html>
