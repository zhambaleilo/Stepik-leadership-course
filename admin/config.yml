# admin/config.yml

backend:
  name: github
  repo: zhambaleilo/Stepik-leadership-course # <-- ИСПРАВЛЕНО: было zhamibailo
  branch: main
  # Если репозиторий приватный, раскомментируй строку ниже для упрощенной авторизации:
  auth_type: implicit 

# Эти параметры помогают CMS корректно формировать абсолютные ссылки и превью
site_url: https://my-pro-skills.ru/ 
display_url: https://my-pro-skills.ru/

# Включает режим редакционного процесса (черновики сохраняются как Pull Request в GitHub)
# Если не нужен, можно удалить эту строку
publish_mode: editorial_workflow

media_folder: "articles/img"
public_folder: "/articles/img"

collections:
  - name: "articles"
    label: "Статьи"
    folder: "articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Дата", name: "date", widget: "datetime"}
      - {label: "Краткое описание для карточки (одна строка)", name: "description", widget: "string"}
      - {label: "Теги через запятую", name: "tags", widget: "string", required: false}
      - {label: "Обложка (необязательно)", name: "cover", widget: "image", required: false}
      - {label: "Текст статьи", name: "body", widget: "markdown"}
